<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechCompanion Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:#141517;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 10px;font-family:'DM Sans',sans-serif;transition:background .5s;}
body.light{background:#C8D8E5;}

/* ── Phone shell ─────────────────────────────────────────────── */
#phone{width:375px;height:736px;background:#1C1E21;border-radius:46px;border:1px solid rgba(180,190,200,.16);box-shadow:0 60px 140px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:all .5s;}
#phone.light{background:#EEF3F8;box-shadow:0 40px 100px rgba(0,0,0,.16);}

/* ── Scrollbar hidden ────────────────────────────────────────── */
*::-webkit-scrollbar{display:none;}

/* ── Animations ──────────────────────────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.18}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ── Status bar ──────────────────────────────────────────────── */
#statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 5px;flex-shrink:0;}
.brand{font-family:'Orbitron',monospace;font-weight:900;font-size:12px;letter-spacing:2px;}
.brand-accent{font-weight:300;}
.ver{font-size:10px;margin-top:1px;}
#theme-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid rgba(180,190,200,.16);border-radius:16px;padding:4px 10px 4px 7px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;}

/* ── Clock ───────────────────────────────────────────────────── */
#clock{padding:9px 18px 11px;flex-shrink:0;border-bottom:1px solid rgba(180,190,200,.09);position:relative;}
#clock::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(82,183,255,.5),rgba(0,229,200,.5),transparent);}
.clock-row{display:flex;align-items:flex-end;justify-content:space-between;}
.clock-digits{display:flex;align-items:flex-end;line-height:1;}
.clock-h{font-family:'Orbitron',monospace;font-weight:900;font-size:33px;letter-spacing:3px;}
.clock-sep{font-family:'Orbitron',monospace;font-weight:200;font-size:33px;opacity:.65;}
.clock-sec{font-family:'Orbitron',monospace;font-size:15px;margin-bottom:3px;margin-left:4px;opacity:.55;}
.clock-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.tz{border:1px solid rgba(180,190,200,.28);border-radius:4px;padding:2px 8px;font-size:9px;font-family:'Orbitron',monospace;letter-spacing:1px;}
.clock-date{font-size:10px;opacity:.5;}

/* ── Nav tabs ────────────────────────────────────────────────── */
#nav{flex-shrink:0;border-bottom:1px solid rgba(180,190,200,.09);position:relative;}
.nav-tabs{display:flex;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 6px;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s;}
.nav-tab .ni{font-size:14px;font-family:'Orbitron',monospace;}
.nav-tab .nl{font-size:10px;}
.nav-indicator{position:absolute;bottom:0;height:2px;border-radius:2px 2px 0 0;background:linear-gradient(90deg,#52B7FF,#00E5C8);transition:left .3s,width .3s;}

/* ── Content ─────────────────────────────────────────────────── */
#content{flex:1;overflow-y:auto;overflow-x:hidden;}

/* ── Cards / shared ──────────────────────────────────────────── */
.card{border-radius:12px;padding:14px;}
.chip{padding:5px 10px;border-radius:20px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s;}
.chip:hover{opacity:.75;}
.btn-primary{flex:1;padding:11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s;font-family:'DM Sans',sans-serif;}
.btn-primary:hover{opacity:.85;}
.btn-icon{width:46px;height:46px;border-radius:9px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s;font-family:'DM Sans',sans-serif;}
.btn-icon:hover{opacity:.75;}

/* ── Skeleton shimmer ────────────────────────────────────────── */
.shimmer{border-radius:5px;background:linear-gradient(90deg,rgba(180,190,200,.12) 25%,rgba(180,190,200,.24) 50%,rgba(180,190,200,.12) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}

/* ── Step item ───────────────────────────────────────────────── */
.step-item{border-radius:10px;padding:11px 13px;display:flex;gap:11px;cursor:pointer;margin-bottom:5px;transition:all .2s;}
.step-cb{width:22px;height:22px;border-radius:6px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;}

/* ── Library item ────────────────────────────────────────────── */
.lib-item{display:flex;align-items:center;gap:11px;padding:12px;border-radius:12px;cursor:pointer;margin-bottom:6px;transition:opacity .2s;}
.lib-item:hover{opacity:.8;}

/* ── Guide card ──────────────────────────────────────────────── */
.guide-card{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border-radius:10px;cursor:pointer;margin-bottom:6px;transition:all .18s;}
.guide-card:hover{transform:translateY(-1px);opacity:.82;}

/* ── Footer label ────────────────────────────────────────────── */
#footer-lbl{margin-top:14px;color:rgba(82,183,255,.1);font-size:9px;font-family:'Orbitron',monospace;letter-spacing:3px;}
</style>
</head>

<script>
// ════════════════════════════════════════════════════════════════
// THEME
// ════════════════════════════════════════════════════════════════
const DARK = {
  bg:'#1C1E21',panel:'#242628',card:'#2C2F33',card2:'#32363B',
  border:'rgba(180,190,200,.08)',border2:'rgba(180,190,200,.16)',border3:'rgba(180,190,200,.28)',
  t1:'#F0F2F5',t2:'#9AA5B1',t3:'#5A6470',t4:'#1A1C1F',
  acc:'#52B7FF',accDim:'rgba(82,183,255,.10)',
  teal:'#00E5C8',tealDim:'rgba(0,229,200,.10)',
  gold:'#D4A853',red:'#FF5252',redDim:'rgba(255,82,82,.10)',
};
const LIGHT = {
  bg:'#EEF3F8',panel:'#F5F8FC',card:'#FFFFFF',card2:'#F0F5FA',
  border:'rgba(40,120,200,.09)',border2:'rgba(40,120,200,.19)',border3:'rgba(40,120,200,.38)',
  t1:'#0A0F14',t2:'#1E3A4A',t3:'#4A6878',t4:'#D0E3F0',
  acc:'#0066BB',accDim:'rgba(0,102,187,.08)',
  teal:'#007A68',tealDim:'rgba(0,122,104,.08)',
  gold:'#9A6E20',red:'#C0303A',redDim:'rgba(192,48,58,.08)',
};

let dark = true;
let T = DARK;

function toggleTheme() {
  dark = !dark;
  T = dark ? DARK : LIGHT;
  applyTheme();
  renderCurrent();
}

function applyTheme() {
  const phone = document.getElementById('phone');
  const body  = document.body;
  phone.style.background  = T.bg;
  phone.style.borderColor = T.border2;
  phone.className = dark ? '' : 'light';
  body.className  = dark ? '' : 'light';
  document.getElementById('brand-text').style.color  = T.t1;
  document.getElementById('brand-accent').style.color = T.acc;
  document.getElementById('ver-text').style.color    = T.t3;
  document.getElementById('theme-btn').style.background = T.card;
  document.getElementById('theme-btn').style.color      = T.t2;
  document.getElementById('theme-btn').style.borderColor = T.border2;
  document.getElementById('theme-icon').textContent  = dark ? '🌙' : '☀️';
  document.getElementById('theme-label').textContent = dark ? 'Dark' : 'Light';
  document.getElementById('clock').style.borderBottomColor = T.border;
  document.getElementById('ch').style.color = T.t1;
  document.getElementById('cm').style.color = T.t1;
  document.getElementById('nav').style.borderBottomColor = T.border;
  document.querySelectorAll('.clock-sep').forEach(e => e.style.color = T.acc);
  document.querySelectorAll('.clock-sec').forEach(e => e.style.color = T.t3);
  document.querySelectorAll('.clock-date').forEach(e => e.style.color = T.t3);
  document.querySelectorAll('.tz').forEach(e => { e.style.color=T.acc; e.style.background=T.accDim; e.style.borderColor=T.border3; });
  updateNavStyle();
}

// ════════════════════════════════════════════════════════════════
// CLOCK
// ════════════════════════════════════════════════════════════════
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('ch').textContent = h;
  document.getElementById('cm').textContent = m;
  const dateStr = now.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  const el = document.getElementById('clock-date');
  if (el) el.textContent = dateStr;
}
setInterval(updateClock, 1000);
updateClock();

// ════════════════════════════════════════════════════════════════
// NAV
// ════════════════════════════════════════════════════════════════
let currentNav = 'search';
let currentScreen = 'main';

function switchNav(id) {
  currentNav = id;
  currentScreen = 'main';
  // BUG-04 fix: do NOT clear product/guides here — the user may want to
  // navigate back to results after visiting Library/Profile. Only clear
  // on an explicit new search (newSearch()) or a fresh doLookup().
  if (id !== 'library') libSearch = '';   // clear library search on tab switch
  error = ''; loading = false;
  updateNavStyle();
  renderCurrent();
}

function updateNavStyle() {
  const tabs = ['search','scan','library','profile'];
  tabs.forEach((id,i) => {
    const tab = document.getElementById('tab-'+id);
    const isActive = id === currentNav;
    tab.querySelector('.ni').style.color = isActive ? T.acc : T.t3;
    tab.querySelector('.nl').style.color = isActive ? T.acc : T.t3;
    tab.querySelector('.nl').style.fontWeight = isActive ? '500' : '400';
    if (isActive) {
      const ind = document.getElementById('nav-indicator');
      ind.style.left = (i * 25) + '%';
      ind.style.width = '25%';
    }
  });
}

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
let query = '';
let eanMode = false;
let eanInput = '';
let loading = false;
let loadMsg = '';
let error = '';
let product = null;
let guides = [];
let activeGuide = null;
let steps = [];
let confirmClear = false;   // BUG-02: two-step clear confirmation
let confidence = 'exact';   // BUG-06: track per-lookup confidence
let db = [
  { product:{name:'Sony WH-1000XM5',brand:'Sony',category:'Headphones',year:'2022',emoji:'🔊',color:'#00B4DC',section:'gadgets',description:'Industry-leading noise cancelling with 30-hour battery and multipoint connection.'},
    guides:[
      {title:'Initial Setup',icon:'🎧',difficulty:'Easy',duration:'10 min',summary:'Connect via Bluetooth and configure basic settings.',steps:['Power on by holding the power button for 2 seconds until the LED turns blue.','Enter pairing mode: hold NC/Ambient + Power button together for 7 seconds.','On your phone, open Bluetooth settings and select WH-1000XM5.','Confirm the pairing when prompted. A voice prompt will confirm connection.','Adjust the headband and ear cups for a secure, comfortable fit.']},
      {title:'Noise Cancelling Setup',icon:'🔇',difficulty:'Easy',duration:'8 min',summary:'Configure ANC modes and ambient sound levels.',steps:['Press the NC/Ambient button to cycle through Noise Cancelling, Ambient Sound, and Off modes.','Open the Sony Headphones Connect app (iOS/Android) for fine-grained control.','Adjust the Ambient Sound level slider from 0–20 to your preference.','Enable Speak-to-Chat in the app — it pauses music when you speak.']},
      {title:'Sound Customisation',icon:'🔊',difficulty:'Medium',duration:'15 min',summary:'Set up EQ, DSEE Extreme and 360 Reality Audio.',steps:['Open Sony Headphones Connect app and tap Sound > Equaliser.','Choose a preset (Bright, Excited, Mellow, Relaxed, Vocal, Treble Boost, Bass Boost, Podcast) or create a custom preset.','Enable DSEE Extreme (AI upscaling for compressed audio) in Sound Quality settings.','If using compatible content, tap 360 Reality Audio > Optimise > take the ear measurement test.','Save your profile — it syncs across all paired devices.']},
    ],
    savedAt: Date.now()-86400000*2, lastSeen: Date.now()-86400000*2 },
  { product:{name:'Dyson V15 Detect',brand:'Dyson',category:'Vacuum Cleaner',year:'2022',emoji:'🌀',color:'#00C8A0',section:'gadgets',description:'Laser-guided vacuum with piezo sensor for scientific proof of clean.'},
    guides:[
      {title:'First Use Setup',icon:'🔋',difficulty:'Easy',duration:'12 min',summary:'Charge, assemble and run the first clean.',steps:['Attach the charging dock to the wall using the two screws provided.','Plug the dock into a power outlet and click the machine into place to charge.','Allow 4.5 hours for a full charge — the LED turns solid green when complete.','Attach your preferred cleaning head (High Torque for carpets, Motorbar for pet hair).','Switch on with the trigger and select Auto mode for intelligent suction adjustment.']},
      {title:'Filter Maintenance',icon:'🫧',difficulty:'Easy',duration:'8 min',summary:'Wash and reinstall the filter correctly.',steps:["Remove the filter unit from the machine's rear by twisting anti-clockwise.",'Tap the filter gently against a bin to dislodge debris.','Rinse under cold running water until the water runs clear — never use soap.','Shake off excess water and leave to dry for at least 24 hours before reinstalling.','Reattach by twisting clockwise until it clicks. Run a test cycle to confirm suction.']},
    ],
    savedAt: Date.now()-86400000*5, lastSeen: Date.now()-86400000*5 },
];
let hist = ['Sony WH-1000XM5','Dyson V15 Detect'];

// ════════════════════════════════════════════════════════════════
// EAN VALIDATION
// ════════════════════════════════════════════════════════════════
const GS1 = {'194252':'Apple','885609':'Dyson','887276':'Samsung','711719':'Sony','840244':'Google','889842':'Microsoft','190021':'DJI','4905524':'Sony'};

function detectBarcodeFormat(q) {
  const d = q.replace(/\D/g,'');
  if (d.length===13) return 'EAN-13';
  if (d.length===12) return 'UPC-A';
  if (d.length===8)  return 'EAN-8';
  return null;
}

function getBrandHint(q) {
  const d = q.replace(/\D/g,'');
  if (d.length < 8) return null;
  for (const len of [7,6,5]) {
    const pr = d.slice(0,len);
    if (GS1[pr]) return GS1[pr];
    if (d[0]==='0') { const s=d.slice(1,len); if (s.length>=5 && GS1[s]) return GS1[s]; }
  }
  return null;
}

function validateEANCheckDigit(digits) {
  const len = digits.length;
  if (![8,12,13].includes(len)) return false;
  if (len===8) {
    let sum=0;
    for (let i=0;i<7;i++) sum+=parseInt(digits[i])*(i%2===0?3:1);
    return (10-(sum%10))%10===parseInt(digits[7]);
  }
  const d = len===12 ? '0'+digits : digits;
  let sum=0;
  for (let i=0;i<12;i++) sum+=parseInt(d[i])*(i%2===0?1:3);
  return (10-(sum%10))%10===parseInt(d[12]);
}

function parseEANInput(q) {
  const digits = q.replace(/[\s\-.]/g,'').replace(/\D/g,'');
  const len = digits.length;
  if (!len) return {status:'none',digits,fmt:null,brand:null,checksumOk:null};
  if (len<8)  return {status:'short',digits,fmt:null,brand:null,checksumOk:null};
  if (len>13) return {status:'too_long',digits,fmt:null,brand:null,checksumOk:null};
  if (![8,12,13].includes(len)) return {status:'partial',digits,fmt:null,brand:null,checksumOk:null};
  const fmt = detectBarcodeFormat(digits);
  const ok  = validateEANCheckDigit(digits);
  const ean13 = len===12 ? '0'+digits : digits;
  return {status:ok?'valid':'invalid',digits,ean13,fmt,brand:getBrandHint(ean13),checksumOk:ok};
}

// ════════════════════════════════════════════════════════════════
// API LOOKUP  (real Anthropic call)
// ════════════════════════════════════════════════════════════════
let cancelFlag = false;

// ── Robust JSON extractor — handles prose-before-JSON, markdown fences, truncation ──
function extractJSON(raw) {
  // 1. Strip markdown fences
  let text = raw.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();

  // 2. Direct parse (ideal path)
  try { return JSON.parse(text); } catch {}

  // 3. Find the first '{' — Haiku sometimes adds a sentence before the JSON
  const start = text.indexOf('{');
  if (start > 0) text = text.slice(start);

  // 4. Try the trimmed version
  try { return JSON.parse(text); } catch {}

  // 5. Walk backwards from the end to find the longest valid JSON object
  for (let end = text.length; end > 1; end--) {
    if (text[end - 1] !== '}') continue;
    try { return JSON.parse(text.slice(0, end)); } catch {}
  }

  // 6. Try appending repair suffixes for truncated responses
  const suffixes = [']}', '"]}', '""]}',"step 4\"]}]}"];
  for (const s of suffixes) {
    try {
      const p = JSON.parse(text + s);
      if (p.guides) return p;
    } catch {}
  }

  throw new Error('Response format unreadable — please try again.');
}

// ── Speed optimisations ───────────────────────────────────────────
// • claude-haiku-4-5   — ~200 tok/s output (vs Sonnet's ~90 tok/s)
// • stream: true       — progress % updates so loading feels live
// • max_tokens: 1024   — raised from 900 to prevent truncation on long names
// • STEP_RULES (BUG-07): all steps must be product-specific
// • validateResult (BUG-08): G-01/G-02 ghost-result validation ported from lookup.js

// BUG-08: validation pipeline from lookup.js — prevents empty names/brands
// and guides with trivial/placeholder steps reaching the UI
const MIN_STEP_CHARS = 12;
const MIN_STEPS_REQ  = 3;
function validateResult(raw, q) {
  if (!raw || typeof raw !== 'object') throw new Error('Invalid response');
  if (raw.restricted) throw new Error('RESTRICTED');
  if (!raw.found) throw new Error('NF:' + q);
  const prod = raw.product || {};
  // G-01: reject empty/placeholder product fields
  if ((prod.name||'').trim().length < 3 || (prod.brand||'').trim().length < 2)
    throw new Error('NF:' + q);
  // G-09: validate year
  const yr = String(prod.year||'').trim(), yi = parseInt(yr,10), now = new Date().getFullYear();
  prod.year = (/^\d{4}$/.test(yr) && yi>=1990 && yi<=now+1) ? yr : '';
  // G-02: filter guides with trivial/empty steps
  const guides = (Array.isArray(raw.guides) ? raw.guides : [])
    .filter(g => g && g.title && g.title.trim())
    .map(g => ({...g, steps: (Array.isArray(g.steps) ? g.steps : [])
      .filter(s => typeof s==='string' && s.trim().length >= MIN_STEP_CHARS)}))
    .filter(g => g.steps.length >= MIN_STEPS_REQ);
  return { product:prod, guides, confidence:raw.confidence||'exact',
           familyVariants:raw.familyVariants||[], lowGuides:guides.length<3 };
}

// BUG-07: STEP_RULES constant — forces Claude to produce product-specific steps
const STEP_RULES = `Step quality rules: every step MUST name a specific button label, menu item, app screen name, or physical action unique to this product. Generic steps like "open settings", "follow on-screen instructions", or "consult the manual" are NOT acceptable. If you cannot identify the exact product, set found:false rather than inventing steps.`;

async function doLookup(raw) {
  const q = (raw || query).trim();
  if (!q) return;
  if (!navigator.onLine) { error = 'No internet connection.'; renderCurrent(); return; }

  cancelFlag = false;
  loading = true; loadMsg = 'Finding device…'; error = '';
  // BUG-03 fix: reset currentScreen so skeleton shows, not stale results
  currentScreen = 'main';
  if (!hist.includes(q)) hist = [q, ...hist].slice(0, 8);
  renderCurrent();

  const rid = setTimeout(() => { if (loading) { loadMsg = 'Almost there…'; renderCurrent(); } }, 6000);

  // BUG-05 fix: allow confidence values exact|family|unknown (was hardcoded "exact")
  const prompt = `You are TechCompanion. The user wants setup guides for: "${q}"

Respond with ONLY a JSON object. No markdown, no prose, no explanation.
Required keys: found (bool), restricted (bool), product (object), guides (array), confidence ("exact"|"family"|"unknown"), familyVariants ([]).
Product keys: name, brand, category, year, emoji, color (#hex), section ("gadgets" or "pc"), description (under 100 chars).
Each guide: title, icon (emoji), difficulty (Easy|Medium|Advanced), duration (e.g. "10 min"), summary (under 70 chars), steps (array of 4 strings, each 1 clear sentence).
Provide exactly 3 guides. Set restricted:true for gas/electrical/plumbing installs. Set found:false if not a real consumer device or PC part. If uncertain about the exact product, set confidence to "unknown".
${STEP_RULES}`;

  let accumulated = '';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model:      'claude-haiku-4-5-20251001',
        max_tokens: 1024,
        stream:     true,
        messages:   [{ role: 'user', content: prompt }],
      }),
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error?.message || `API error ${res.status}`);
    }

    // ── Stream: accumulate tokens, show live % progress ───────────
    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    const EST_TOTAL = 750; // estimated total chars for this prompt

    while (true) {
      if (cancelFlag) { reader.cancel(); break; }
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (payload === '[DONE]') break;
        try {
          const evt = JSON.parse(payload);
          if (evt.type === 'content_block_delta' && evt.delta?.type === 'text_delta') {
            accumulated += evt.delta.text;
            // Live progress bar in the loading banner
            const pct = Math.min(90, Math.round((accumulated.length / EST_TOTAL) * 90));
            loadMsg = `Generating… ${pct}%`;
            renderCurrent();
          }
        } catch { /* malformed SSE line */ }
      }
    }

    clearTimeout(rid);
    if (cancelFlag) { loading = false; renderCurrent(); return; }

    // ── Parse the complete accumulated response ───────────────────
    loadMsg = 'Finishing…';
    renderCurrent();

    const parsed = extractJSON(accumulated);

    // BUG-08: run full G-01/G-02/G-09 validation (ported from lookup.js)
    let validated;
    try {
      validated = validateResult(parsed, q);
    } catch(ve) {
      loading = false;
      if (ve.message.startsWith('NF:'))
        error = `We couldn't identify "${q}". Try the full product name or model number.`;
      else if (ve.message === 'RESTRICTED')
        error = 'This device requires professional installation. TechCompanion covers consumer gadgets and PC hardware only.';
      else
        error = ve.message;
      renderCurrent(); return;
    }

    if (parsed.restricted) {
      loading = false;
      error = 'This device requires professional installation. TechCompanion covers consumer gadgets and PC hardware only.';
      renderCurrent(); return;
    }
    if (!parsed.found) {
      loading = false;
      error = `We couldn't identify "${q}". Try the full product name or model number.`;
      renderCurrent(); return;
    }

    product    = validated.product;
    guides     = validated.guides;
    confidence = validated.confidence;   // BUG-06: store for badge logic
    loading = false; error = '';

    // Auto-save to library
    const entry = { product, guides, savedAt: Date.now(), lastSeen: Date.now() };
    db = [entry, ...db.filter(d => d.product.name !== product.name)].slice(0, 20);

    currentScreen = 'results';
    renderCurrent();

  } catch (err) {
    clearTimeout(rid);
    if (cancelFlag) { loading = false; renderCurrent(); return; }
    loading = false;
    error = (!navigator.onLine || err.message.includes('fetch'))
      ? 'No internet connection. Please check your network.'
      : (err.message.length < 140 ? err.message : 'Something went wrong. Please try again.');
    renderCurrent();
  }
}

function renderCurrent() {
  applyTheme();
  const el = document.getElementById('content');
  el.style.background = T.bg;

  if (currentNav==='search') {
    if (loading) { el.innerHTML = renderSkeleton(); return; }
    if (currentScreen==='results' && product) { el.innerHTML = renderResults(); bindResults(); return; }
    if (currentScreen==='walkthrough' && activeGuide) { el.innerHTML = renderWalkthrough(); bindWalkthrough(); return; }
    el.innerHTML = renderSearch(); bindSearch();
    return;
  }
  if (currentNav==='scan')    { el.innerHTML = renderScanner(); return; }
  if (currentNav==='library') { el.innerHTML = renderLibrary(); bindLibrary(); return; }
  if (currentNav==='profile') { el.innerHTML = renderProfile(); return; }
}

  const dc = diffC[g.difficulty]||acc;
  const totalM = parseInt(g.duration)||0;
  const remM = totalM>0&&done>0&&pct<100 ? Math.round(totalM*(steps.length-done)/steps.length) : null;

  let html = `<div style="padding:4px 18px 24px;display:flex;flex-direction:column;gap:10px;animation:fadeIn .3s ease;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding-top:8px;">
      <button onclick="backToResults()" style="background:transparent;border:none;color:${acc};font-size:13px;cursor:pointer;padding:4px 0;font-weight:500;font-family:'DM Sans',sans-serif;">← Back to guides</button>
      <div style="display:flex;gap:8px;">
        ${done<steps.length?`<button onclick="markAllDone()" style="background:transparent;border:1px solid ${b2};border-radius:6px;color:${t3};font-size:11px;cursor:pointer;padding:3px 9px;font-family:'DM Sans',sans-serif;">Mark all done</button>`:''}
        ${done>0&&pct<100?`<button onclick="resetProgress()" style="background:transparent;border:none;color:${t3};font-size:11px;cursor:pointer;text-decoration:underline;font-family:'DM Sans',sans-serif;">Reset</button>`:''}
      </div>
    </div>
    ${done>0&&pct<100?`<div style="padding:9px 13px;border-radius:8px;background:${accD};border:1px solid ${b2};display:flex;align-items:center;gap:8px;">
      <span>↩</span>
      <p style="color:${acc};font-size:12px;font-weight:500;">Picking up where you left off — ${done} of ${steps.length} steps done.</p>
    </div>`:''}
    <div style="background:${card2};border-radius:12px;padding:14px 16px;border:1px solid ${b};border-left:3px solid ${pc};">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:${g.summary?8:0}px;">
        <span style="font-size:22px;flex-shrink:0;">${g.icon}</span>
        <div style="flex:1;">
          <p style="color:${t1};font-size:15px;font-weight:600;">${g.title}</p>
          <p style="color:${t3};font-size:11px;margin-top:2px;">${product.name} · ${g.duration}${remM&&done>0&&pct<100?` <span style="color:${acc};margin-left:6px;">~${remM} min left</span>`:''}}</p>
        </div>
        ${g.difficulty?`<span style="font-size:11px;padding:3px 8px;border-radius:5px;font-weight:500;background:${dc}15;border:1px solid ${dc}35;color:${dc};flex-shrink:0;">${diffSym[g.difficulty]||''} ${g.difficulty}</span>`:''}
      </div>
      ${g.summary?`<p style="color:${t2};font-size:12.5px;line-height:1.55;padding-top:8px;border-top:1px solid ${b};">${g.summary}</p>`:''}
      <div style="display:flex;justify-content:space-between;margin-bottom:5px;margin-top:10px;">
        <span style="color:${t3};font-size:11px;">${done} of ${steps.length} steps done</span>
        <span style="color:${pc};font-weight:600;font-size:12px;">${pct}%</span>
      </div>
      <div style="height:4px;background:${T.t4};border-radius:4px;overflow:hidden;">
        <div style="height:100%;border-radius:4px;width:${pct}%;background:linear-gradient(90deg,${pc},${acc});transition:width .4s;"></div>
      </div>
    </div>
    <div style="display:flex;gap:12px;padding:2px;">
      <span style="font-size:10px;color:${teal};">● Easy</span>
      <span style="font-size:10px;color:${acc};">◆ Medium</span>
      <span style="font-size:10px;color:${T.gold};">▲ Advanced</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;">`;

  steps.forEach((s,i) => {
    const cbfill = s.done ? pc : 'transparent';
    html += `<div class="step-item" id="step-${i}" onclick="toggleStep(${i})" style="opacity:${s.done?.45:1};background:${s.done?bg:card};border:1px solid ${s.done?b:b2};">
      <div class="step-cb" style="border:1.5px solid ${s.done?pc:t3};background:${cbfill};">
        ${s.done?`<span style="color:#fff;font-size:11px;font-weight:700;">✓</span>`:''}
      </div>
      <div style="flex:1;">
        <p style="color:${t3};font-size:10px;font-weight:500;margin-bottom:3px;">Step ${i+1}</p>
        <p style="color:${s.done?t3:t2};font-size:13px;line-height:1.55;text-decoration:${s.done?'line-through':'none'};">${s.text}</p>
      </div>
    </div>`;
  });

  html += `</div>`;

  if (pct===100) {
    html += `<div style="border-radius:12px;padding:20px;background:${T.tealDim};border:1px solid ${teal}40;text-align:center;animation:fadeIn .4s ease;">
      <div style="font-size:36px;margin-bottom:8px;">🎉</div>
      <p style="color:${teal};font-size:16px;font-weight:600;margin-bottom:4px;">All done!</p>
      <p style="color:${t2};font-size:13px;line-height:1.5;">You've completed <strong>${g.title}</strong>.</p>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:14px;">
        <button onclick="backToResults()" style="padding:10px 22px;border-radius:9px;border:1px solid ${teal};background:transparent;color:${teal};font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;">← Back to guides</button>
        <button onclick="resetProgress()" style="padding:10px 18px;border-radius:9px;border:1px solid ${b2};background:transparent;color:${t3};font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;">Start again</button>
      </div>
    </div>`;
  }

  return html + '</div>';
}

function bindWalkthrough() {}

  const SAMPLES = [['5025155047781','Dyson V15 Detect'],['0194253387244','AirPods Pro 2'],['0741279005632','RTX 4090'],['4905524946536','Sony headphones']];

      <button onclick="alert('QR Code scanning available in the native mobile app.')" style="flex:1;padding:8px 6px;border-radius:8px;background:transparent;border:1px solid ${b2};color:${t3};font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;">▣ QR Code</button>

        <div style="position:absolute;bottom:10px;left:10px;width:20px;height:20px;border-bottom:2px solid ${acc};border-left:2px solid ${acc};"></div>

        <span style="font-family:monospace;">${code}</span>

// ── LIBRARY ───────────────────────────────────────────────────────
let libSearch = '';   // library search query state

function renderLibrary() {
  const t1=T.t1,t2=T.t2,t3=T.t3,b=T.border,b2=T.border2,card=T.card,acc=T.acc,accD=T.accDim,red=T.red,redD=T.redDim;
  const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

  // Filter db by search query — matches name, brand, or category (case-insensitive)
  const q = libSearch.trim().toLowerCase();
  const filtered = q
    ? db.filter(d =>
        d.product.name.toLowerCase().includes(q) ||
        d.product.brand.toLowerCase().includes(q) ||
        d.product.category.toLowerCase().includes(q)
      )
    : db;

  let html = `<div style="padding:12px 18px 22px;display:flex;flex-direction:column;gap:12px;animation:fadeIn .3s ease;">
    <div>
      <p style="color:${t3};font-size:11px;margin-bottom:3px;">Auto-saved</p>
      <h2 style="font-family:'Orbitron',monospace;font-weight:700;font-size:18px;color:${t1};">Library</h2>
      ${db.length?`<p style="color:${t3};font-size:11.5px;margin-top:4px;">${db.length} device${db.length!==1?'s':''} saved</p>`:''}
    </div>`;

  // Search bar — only show when there are devices to search
  if (db.length > 0) {
    html += `<div style="display:flex;gap:7px;align-items:center;background:${card};border-radius:10px;padding:10px 13px;border:1px solid ${q?acc:b2};transition:border .2s;">
      <span style="color:${q?acc:t3};font-size:14px;flex-shrink:0;">⌕</span>
      <input
        id="lib-search"
        style="flex:1;background:transparent;border:none;outline:none;color:${t1};font-size:13px;font-family:'DM Sans',sans-serif;"
        placeholder="Search devices, brands, categories…"
        maxlength="80"
        value="${libSearch.replace(/"/g,'&quot;')}"
        oninput="libSearch=this.value;renderCurrent();setTimeout(()=>{const el=document.getElementById('lib-search');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0)"
      >
      ${libSearch?`<button onclick="libSearch='';renderCurrent()" style="background:transparent;border:none;color:${t3};font-size:13px;cursor:pointer;flex-shrink:0;">✕</button>`:''}
    </div>`;
  }

  if (!db.length) {
    html += `<div style="display:flex;flex-direction:column;align-items:center;padding:40px 20px;text-align:center;gap:12px;">
      <div style="font-size:40px;opacity:.2;">▣</div>
      <p style="color:${t2};font-size:14px;font-weight:500;">Your library is empty</p>
      <p style="color:${t3};font-size:12px;line-height:1.6;max-width:240px;">Search for a device to get setup guides — everything you look up is saved here automatically.</p>
      <button onclick="switchNav('search')" style="padding:10px 22px;border-radius:9px;border:1px solid ${acc};background:${accD};color:${acc};font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;">Search for a device</button>
    </div>`;
  } else if (q && !filtered.length) {
    // No results for the current search query
    html += `<div style="display:flex;flex-direction:column;align-items:center;padding:32px 20px;text-align:center;gap:10px;">
      <div style="font-size:32px;opacity:.25;">⌕</div>
      <p style="color:${t2};font-size:14px;font-weight:500;">No results for "${libSearch}"</p>
      <p style="color:${t3};font-size:12px;line-height:1.5;">Try a different name, brand, or category.</p>
      <button onclick="libSearch='';renderCurrent()" style="padding:8px 18px;border-radius:8px;border:1px solid ${b2};background:transparent;color:${t2};font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;">Clear search</button>
    </div>`;
  } else {
    const sections = [{id:'gadgets',label:'Gadgets & Appliances'},{id:'pc',label:'PC Components'},{id:'other',label:'Other Devices'}];
    sections.forEach(sec => {
      // Use filtered when searching, full db when not
      const entries = filtered.filter(d => sec.id==='other' ? !['gadgets','pc'].includes(d.product.section) : d.product.section===sec.id);
      if (!entries.length) return;
      html += `<div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <p style="color:${t3};font-size:11px;font-weight:500;">${sec.label}</p>
          <div style="flex:1;height:1px;background:${b};"></div>
          <span style="color:${t3};font-size:11px;">${entries.length}</span>
        </div>`;
      entries.forEach(e => {
        const pc = e.product.color||acc;
        // Highlight matching text if searching
        const highlight = (str) => {
          if (!q) return str;
          const idx = str.toLowerCase().indexOf(q);
          if (idx === -1) return str;
          return str.slice(0,idx) +
            `<mark style="background:${acc}30;color:${acc};border-radius:2px;padding:0 1px;">${str.slice(idx,idx+q.length)}</mark>` +
            str.slice(idx+q.length);
        };
        html += `<div class="lib-item" onclick="openLibEntry('${e.product.name.replace(/'/g,"\\'")}')" style="background:${card};border:1px solid ${b};border-left:2px solid ${pc};">
          <div style="width:42px;height:42px;border-radius:10px;background:${pc}22;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${e.product.emoji}</div>
          <div style="flex:1;min-width:0;">
            <p style="color:${t1};font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${highlight(e.product.name)}</p>
            <p style="color:${t3};font-size:10px;margin-top:1px;">${highlight(e.product.brand)} · ${highlight(e.product.category)}</p>
            <p style="color:${pc};font-size:11px;margin-top:3px;font-weight:500;">${e.guides.length} guide${e.guides.length!==1?'s':''} · ${fmtDate(e.lastSeen)}</p>
          </div>
          <button onclick="event.stopPropagation();removeEntry('${e.product.name.replace(/'/g,"\\'")}');" style="flex-shrink:0;background:${redD};border:1px solid ${red}30;border-radius:6px;color:${red};font-size:11px;cursor:pointer;padding:6px 10px;font-weight:500;min-height:32px;font-family:'DM Sans',sans-serif;">✕</button>
        </div>`;
      });
      html += `</div>`;
    });
    // Only show clear/footer when not in a filtered search view
    if (!q) {
      html += `${confirmClear ?
        `<div style="padding:12px 14px;border-radius:8px;background:${redD};border:1px solid ${red}30;display:flex;flex-direction:column;gap:8px;">
          <p style="color:${red};font-size:12px;font-weight:500;">Remove all ${db.length} device${db.length!==1?'s':''}?</p>
          <p style="color:${t3};font-size:11px;line-height:1.5;">This cannot be undone. Walkthrough progress will also be cleared.</p>
          <div style="display:flex;gap:8px;">
            <button onclick="confirmClear=false;db=[];renderCurrent()" style="flex:1;padding:8px;border-radius:7px;border:1px solid ${red};background:${red};color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;">Yes, clear all</button>
            <button onclick="confirmClear=false;renderCurrent()" style="flex:1;padding:8px;border-radius:7px;border:1px solid ${b2};background:transparent;color:${t3};font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;">Cancel</button>
          </div>
        </div>`
        :
        `<button onclick="confirmClear=true;renderCurrent()" style="width:100%;padding:9px;border-radius:8px;border:1px solid ${red}25;background:transparent;color:${red};font-size:12px;cursor:pointer;margin-top:4px;font-weight:500;opacity:.65;font-family:'DM Sans',sans-serif;">Clear all devices</button>`
      }
      <p style="font-size:11px;color:${t3};line-height:1.55;padding:0 2px;opacity:.7;">Stored locally in your browser. Clearing browser data will remove it.</p>`;
    } else {
      html += `<button onclick="libSearch='';renderCurrent()" style="width:100%;padding:9px;border-radius:8px;border:1px solid ${b2};background:transparent;color:${t3};font-size:12px;cursor:pointer;font-weight:500;font-family:'DM Sans',sans-serif;">Show all ${db.length} device${db.length!==1?'s':''}</button>`;
    }
  }
  return html + '</div>';
}

function bindLibrary() {}

// ── PROFILE ───────────────────────────────────────────────────────
function renderProfile() {
  const t1=T.t1,t2=T.t2,t3=T.t3,b=T.border,b2=T.border2,card=T.card,acc=T.acc;
  const guides_total = db.reduce((a,d)=>a+d.guides.length,0);
  return `<div style="padding:12px 18px 22px;display:flex;flex-direction:column;gap:12px;animation:fadeIn .3s ease;">
    <div style="display:flex;flex-direction:column;align-items:center;padding:16px 0 8px;gap:8px;">
      <div style="width:62px;height:62px;border-radius:18px;background:${card};display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:700;font-size:17px;color:${acc};border:1px solid ${b2};">TC</div>
      <p style="font-size:15px;font-weight:600;color:${t1};">Tech User</p>
      <p style="color:${t3};font-size:11px;">TechCompanion v5.3</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">
      ${[{v:db.length,l:'Devices'},{v:hist.length,l:'Searches'},{v:guides_total,l:'Guides'}].map(s=>`
      <div style="background:${card};border-radius:10px;padding:12px 8px;text-align:center;border:1px solid ${b};">
        <p style="font-family:'Orbitron',monospace;font-weight:900;font-size:22px;color:${acc};line-height:1;">${s.v}</p>
        <p style="color:${t3};font-size:11px;margin-top:4px;">${s.l}</p>
      </div>`).join('')}
    </div>
    <div>
      <p style="color:${t3};font-size:11px;font-weight:500;margin-bottom:8px;">Settings</p>
      ${[
        {icon:'🌙',l:'Theme',v:dark?'Dark mode':'Light mode',action:'toggleTheme()'},
        {icon:'🤖',l:'AI Model',v:'Claude Haiku'},
        {icon:'💾',l:'Auto-save',v:'On (localStorage)'},
        {icon:'◎', l:'Scanner',v:'Barcode + QR'},
        {icon:'ℹ️',l:'Version',v:'5.3 (Demo)'},
      ].map(item=>`
      <div onclick="${item.action||''}" style="display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border-radius:9px;cursor:${item.action?'pointer':'default'};margin-bottom:4px;background:${card};border:1px solid ${b};transition:opacity .15s;" ${item.action?`onmouseover="this.style.opacity=.75" onmouseout="this.style.opacity=1"`:''}}>
        <div style="display:flex;align-items:center;gap:9px;">
          <span style="font-size:15px;">${item.icon}</span>
          <span style="color:${t2};font-size:13px;">${item.l}</span>
        </div>
        <span style="color:${item.action?acc:t3};font-size:12px;font-weight:${item.action?500:400};">${item.v}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════════════════════════
function setEanMode(v) { eanMode=v; eanInput=''; error=''; renderCurrent(); }
function onEanInput(v) { eanInput=v; renderCurrent(); setTimeout(()=>{const el=document.getElementById('ean-input');if(el){el.value=v;el.focus();el.setSelectionRange(v.length,v.length);}},0); }
function clearEan() { eanInput=''; error=''; renderCurrent(); }
function clearSearch() { query=''; error=''; renderCurrent(); }
function tryEanSearch() { const ean=parseEANInput(eanInput); if(ean.status==='valid'){const n=ean.ean13||eanInput;query=n;switchNav('search');doLookup(n);} }
function trySample(code) { query=code; switchNav('search'); doLookup(code); }
function cancelLookup() { cancelFlag=true; loading=false; error=''; renderCurrent(); }
function newSearch() { currentScreen='main'; query=''; eanMode=false; eanInput=''; error=''; product=null; guides=[]; confidence='exact'; renderCurrent(); }
function backToResults() { currentScreen='results'; activeGuide=null; renderCurrent(); }
function openGuide(i) { activeGuide=guides[i]; steps=(activeGuide.steps||[]).map(t=>({text:t,done:false})); currentScreen='walkthrough'; renderCurrent(); }
function toggleStep(i) { steps[i].done=!steps[i].done; renderCurrent(); }
function markAllDone() { steps=steps.map(s=>({...s,done:true})); renderCurrent(); }
function resetProgress() { steps=steps.map(s=>({...s,done:false})); renderCurrent(); }
function openLibEntry(name) { const e=db.find(d=>d.product.name===name); if(!e)return; product=e.product; guides=e.guides; confidence='exact'; currentScreen='results'; currentNav='search'; updateNavStyle(); renderCurrent(); }
function removeEntry(name) { db=db.filter(d=>d.product.name!==name); renderCurrent(); }
function clearLibrary() { db=[]; confirmClear=false; renderCurrent(); }
// WARN-02: Wrong device? — removes result from library and returns to search
function wrongDevice() {
  if (product) { db=db.filter(d=>d.product.name!==product.name); }
  product=null; guides=[]; confidence='exact';
  currentScreen='main';
  renderCurrent();
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
applyTheme();
updateNavStyle();
renderCurrent();
</script>
